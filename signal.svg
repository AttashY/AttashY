<radialGradient id="glow2"><stop offset="0" stop-color="#14b8a6" stop-opacity="0.32"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
<g><animateTransform attributeName="transform" type="translate" values="0 0; 80 -20; -60 -10; 0 0" dur="30s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/><ellipse cx="190.0" cy="150" rx="132.0" ry="100.0" fill="url(#glow2)"/></g>
<radialGradient id="glow3"><stop offset="0" stop-color="#e5484d" stop-opacity="0.32"/><stop offset="1" stop-color="#e5484d" stop-opacity="0"/></radialGradient>
<g><animateTransform attributeName="transform" type="translate" values="0 0; -40 -30; 10 -10; 0 0" dur="24s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/><ellipse cx="360.0" cy="130" rx="96.0" ry="110.0" fill="url(#glow3)"/></g>
</g>
<rect x="0.5" y="0.5" width="399" height="179" rx="14" fill="none" stroke="#2a3566"/>
