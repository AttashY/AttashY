<svg xmlns="http://www.w3.org/2000/svg" width="400" height="180" viewBox="0 0 400 180">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1226"/><stop offset="1" stop-color="#060a16"/>
  </linearGradient>
  <clipPath id="frame"><rect width="400" height="180" rx="14"/></clipPath>
  <path id="orbit" d="M 300 52 C 340 40, 380 60, 350 80 C 320 100, 270 70, 300 52 Z"/>
</defs>
<style>
  text { font-family: 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; }
  .title { font-size: 18px; font-weight: 800; fill: #ffffff; }
  .sub { font-size: 9px; font-weight: 600; fill: #8a93b8; letter-spacing: 0.6px; }
  .label { font-size: 8.5px; font-weight: 700; fill: #c0caf5; letter-spacing: 0.2px; }
  .value { font-size: 20px; font-weight: 800; }
  .tile { fill: #070b18; fill-opacity: 0.75; stroke: #2f3a6b; }
  .panel { fill: #070b18; fill-opacity: 0.55; stroke: #2f3a6b; }
  .track { fill: #22283d; }
</style>
<g clip-path="url(#frame)">
<rect width="400" height="180" fill="url(#bg)"/>
<radialGradient id="glow0"><stop offset="0" stop-color="#4a5cff" stop-opacity="0.32"/><stop offset="1" stop-color="#4a5cff" stop-opacity="0"/></radialGradient>
<g><animateTransform attributeName="transform" type="translate" values="0 0; 60 30; 20 -20; 0 0" dur="22s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/><ellipse cx="75.0" cy="40" rx="108.0" ry="110.0" fill="url(#glow0)"/></g>
