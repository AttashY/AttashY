name: Generate profile cards

on:
  schedule:
    - cron: "0 1 * * *"   # runs once a day
  workflow_dispatch:       # adds a "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Download this repo's files
        uses: actions/checkout@v4

      - name: Draw the galaxy
        run: python3 scripts/galaxy.py
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw the projects list
        run: python3 scripts/projects.py
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw the language stack
        run: python3 scripts/stack.py
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw the snake trail
        run: python3 scripts/snake.py
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw the profile signal and streak cards
        run: python3 scripts/stats.py
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the cards to the galaxy-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: galaxy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
