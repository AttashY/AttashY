name: Generate profile cards

on:
  schedule:
    - cron: "0 */6 * * *" # runs every 6 hours
  workflow_dispatch:       # adds a "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Download this repo's files
        uses: actions/checkout@v4

      - name: Draw the galaxy
        run: python3 scripts/galaxy.py
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw the projects list
        run: python3 scripts/projects.py
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw the language stack
        run: python3 scripts/stack.py
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw the snake trail
        run: python3 scripts/snake.py
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw the signal, streak and activity cards
        run: python3 scripts/stats.py
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pillow (used to turn your profile picture into ASCII)
        run: pip install pillow

      - name: Draw the neofetch header
        run: python3 scripts/neofetch.py
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make the link chips and update the README
        run: python3 scripts/links.py
        env:
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Push the cards to the galaxy-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: galaxy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save the README if the links changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "Update links" && git push)
