<svg xmlns="http://www.w3.org/2000/svg" width="132" height="46" viewBox="0 0 132 46">
<defs>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0.3" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
    <animateTransform attributeName="gradientTransform" type="rotate"
      from="0 0.5 0.5" to="360 0.5 0.5" dur="4s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<style>
  text { font-family: 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; }
  .name { font-size: 9px; font-weight: 700; fill: #a9a3ff; letter-spacing: 1px; }
  .handle { font-size: 12px; font-weight: 700; fill: #ffffff; }
  .letter { font-size: 13px; font-weight: 800; fill: #ffffff; }
</style>
<rect x="3" y="3" width="126" height="40" rx="20.0" fill="#0b0c1a" stroke="#5b63c9" stroke-width="1.5"/>
<rect x="3" y="3" width="126" height="40" rx="20.0" fill="none" stroke="url(#shine)" stroke-width="1.8"/>
<circle cx="26" cy="23.0" r="13" fill="#ffffff"/><image href="data:image/png;base64," x="17" y="14.0" width="18" height="18"/>
<text x="48" y="20.0" class="name">GitHub</text>
<text x="48" y="34.0" class="handle">@AttashY</text>
</svg>